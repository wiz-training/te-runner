name: canary
# Nightly live boot of te-dev-aws (05:00 UTC, an hour before reap.yml at 06:00 UTC so any session left
# behind by a crashed run is swept the same morning). Runs on the host runner, never inside the
# te-runner container, because headless Chromium needs host libraries.
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      lab:
        description: "Lab slug to canary"
        type: string
        default: "te-dev-aws"
permissions:
  contents: read
  issues: write
jobs:
  canary:
    runs-on: ubuntu-24.04
    concurrency:
      group: canary-${{ inputs.lab || 'te-dev-aws' }}
      cancel-in-progress: false
    env:
      LAB: ${{ inputs.lab || 'te-dev-aws' }}
    steps:
      # `runner.temp` is not a valid context in a job-level `env:` (GitHub rejects the dispatch with
      # "Unrecognized named-value: 'runner'"), so the two paths are set from inside a step instead.
      - name: paths
        run: |
          echo "WIZLAB_PLAY_DIR=$RUNNER_TEMP/wizlab-play-$LAB" >> "$GITHUB_ENV"
          echo "CANARY_STATE_DIR=$RUNNER_TEMP/canary-state" >> "$GITHUB_ENV"
      - name: check required secrets
        env:
          WIZ_LABS_GH_APP: ${{ secrets.WIZ_LABS_GH_APP }}
          INSTRUQT_API: ${{ secrets.INSTRUQT_TOKEN }}
        run: |
          if [ -z "$WIZ_LABS_GH_APP" ]; then
            echo "::error::missing secret WIZ_LABS_GH_APP (the wiz-labs-code-grader App: {app_id, install_id, key}; it checks out te-labkit-v2)"
            exit 1
          fi
          if [ -z "$INSTRUQT_API" ]; then
            echo "::error::missing secret INSTRUQT_TOKEN"
            exit 1
          fi
      - name: checkout te-runner
        uses: actions/checkout@v5
      - name: app token
        id: app
        uses: ./.github/actions/app-token
        with:
          app: ${{ secrets.WIZ_LABS_GH_APP }}
      - name: checkout te-labkit-v2
        uses: actions/checkout@v5
        with:
          repository: wiz-training/te-labkit-v2
          token: ${{ steps.app.outputs.token }}
          path: labkit
      - name: setup python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: install playwright
        run: |
          pip install playwright==1.64.1   # the version the 2026-10-27 runs resolved; bump on purpose
          playwright install --with-deps chromium
      # A pt_ token binds to the browser identity in WIZLAB_PLAY_DIR; without caching that directory
      # across runs, `play stop --lab` in the clean step cannot see `Resume lab` to stop an orphan play.
      - name: cache browser profile
        uses: actions/cache@v4
        with:
          path: ${{ env.WIZLAB_PLAY_DIR }}
          key: wizlab-play-${{ inputs.lab || 'te-dev-aws' }}-${{ github.run_id }}
          restore-keys: |
            wizlab-play-${{ inputs.lab || 'te-dev-aws' }}-
      - name: clean
        env:
          INSTRUQT_API: ${{ secrets.INSTRUQT_TOKEN }}
        run: |
          python3 labkit/scripts/wizops play stop --lab "$LAB" || true
      - name: boot
        env:
          INSTRUQT_API: ${{ secrets.INSTRUQT_TOKEN }}
        run: |
          mkdir -p "$CANARY_STATE_DIR"
          rc=0
          python3 labkit/scripts/wizops play start --lab "$LAB" --grep "^CANARY" \
            >"$CANARY_STATE_DIR/attempt1.out" 2>"$CANARY_STATE_DIR/attempt1.err" || rc=$?
          cat "$CANARY_STATE_DIR/attempt1.out"
          cat "$CANARY_STATE_DIR/attempt1.err" >&2
          cp "$CANARY_STATE_DIR/attempt1.out" "$CANARY_STATE_DIR/boot.out"
          cp "$CANARY_STATE_DIR/attempt1.err" "$CANARY_STATE_DIR/boot.err"
          attempts=1
          if [ "$rc" -eq 1 ] && grep -q "Lab failed to start" "$CANARY_STATE_DIR/attempt1.err"; then
            echo "attempt 1 hit Lab failed to start; retrying once" >&2
            attempts=2
            rc=0
            python3 labkit/scripts/wizops play start --lab "$LAB" --grep "^CANARY" \
              >"$CANARY_STATE_DIR/attempt2.out" 2>"$CANARY_STATE_DIR/attempt2.err" || rc=$?
            cat "$CANARY_STATE_DIR/attempt2.out"
            cat "$CANARY_STATE_DIR/attempt2.err" >&2
            cp "$CANARY_STATE_DIR/attempt2.out" "$CANARY_STATE_DIR/boot.out"
            cp "$CANARY_STATE_DIR/attempt2.err" "$CANARY_STATE_DIR/boot.err"
          fi
          printf '%s\n' "$rc" >"$CANARY_STATE_DIR/boot.rc"
          printf '%s\n' "$attempts" >"$CANARY_STATE_DIR/boot.attempts"
      - name: verdict
        run: |
          python3 - <<'PY'
          import os, pathlib, re, subprocess, sys
          state = pathlib.Path(os.environ["CANARY_STATE_DIR"])
          lab = os.environ.get("LAB", "te-dev-aws")
          rc = int((state / "boot.rc").read_text().strip())
          attempts = int((state / "boot.attempts").read_text().strip())
          out = (state / "boot.out").read_text() if (state / "boot.out").exists() else ""
          err1 = (state / "attempt1.err").read_text() if (state / "attempt1.err").exists() else ""
          err2 = (state / "attempt2.err").read_text() if (state / "attempt2.err").exists() else ""
          err = (state / "boot.err").read_text().strip() if (state / "boot.err").exists() else ""
          grep_lines = [ln[5:] for ln in out.splitlines() if ln.startswith("GREP=")]
          if rc == 0:
              if "CANARY=ok" in grep_lines:
                  outcome = "ok"
              elif "CANARY=degraded" in grep_lines:
                  outcome = "degraded"
              elif grep_lines == ["none"] or not any(ln.startswith("CANARY=") for ln in grep_lines):
                  outcome = "no-verdict"
              else:
                  outcome = "error"
          elif attempts >= 2 and "Lab failed to start" in err1 and "Lab failed to start" in err2:
              outcome = "no-sandbox"
          else:
              outcome = "error"
          lines = [
              f"### Canary: `{lab}` — `{outcome}` (attempts: {attempts})",
              "",
          ]
          if grep_lines:
              lines.extend(f"- `GREP={ln}`" for ln in grep_lines)
          runner = next((ln.split("=", 1)[1].strip() for ln in grep_lines if ln.startswith("CANARY_RUNNER=")), "")
          def _ver(s):
              m = re.fullmatch(r"v(\d+(?:\.\d+)*)", s)
              return tuple(int(p) for p in m.group(1).split(".")) if m else None
          if rver := _ver(runner):
              try:
                  ls = subprocess.run(
                      ["git", "ls-remote", "--tags", "--refs", "origin", "refs/tags/v*"],
                      capture_output=True, text=True, check=False, timeout=15,
                  )
              except (OSError, subprocess.SubprocessError):
                  ls = None
              tags = []
              for ln in (ls.stdout.splitlines() if ls and ls.returncode == 0 else []):
                  if "\trefs/tags/" in ln:
                      t = ln.split("\trefs/tags/", 1)[1].strip()
                      if tv := _ver(t):
                          tags.append((tv, t))
              if tags:
                  newest_ver, newest_tag = max(tags)
                  if rver < newest_ver:
                      print(f"::warning::{lab} runs te-runner {runner} behind newest tag {newest_tag}")
                      lines.append(f"- note: `{lab}` runs `{runner}` (newest `te-runner` tag: `{newest_tag}`)")
          if err and outcome != "ok":
              lines.extend(["", f"stderr: `{err.splitlines()[-1]}`"])
          summary = "\n".join(lines) + "\n"
          (state / "outcome").write_text(outcome)
          (state / "summary.md").write_text(summary)
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as fh:
                  fh.write(summary)
          print(summary, end="")
          sys.exit(0 if outcome == "ok" else 1)
          PY
      - name: stop on failure
        if: failure()
        env:
          INSTRUQT_API: ${{ secrets.INSTRUQT_TOKEN }}
        run: |
          python3 labkit/scripts/wizops play stop --lab "$LAB" || true
      - name: report issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          outcome=$(cat "$CANARY_STATE_DIR/outcome" 2>/dev/null || echo "")
          case "$outcome" in
            degraded|no-verdict|no-sandbox|error) ;;
            *) exit 0 ;;
          esac
          today=$(date -u +%Y-%m-%d)
          gh label create canary --description "Nightly lab canary failure" --color d93f0b 2>/dev/null || true
          existing=$(gh issue list --state open --label canary --search "\"on $LAB\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file "$CANARY_STATE_DIR/summary.md"
          else
            gh issue create --label canary --title "canary $today: $outcome on $LAB" --body-file "$CANARY_STATE_DIR/summary.md"
          fi
  # GameKit: the service is a Lambda, not a lab, so its canary is one round trip from this runner — create an
  # event from the `canary` pack, register, answer one question of each type, read the board, delete the
  # event — with no standing event and no sandbox hours. Lives here because te-gamekit-service is private
  # and the org's Actions minutes run only on public repos.
  gamekit:
    runs-on: ubuntu-24.04
    concurrency:
      group: canary-gamekit
      cancel-in-progress: false
    env:
      GAMEKIT_URL: https://zl5uwon984.execute-api.us-east-1.amazonaws.com
    steps:
      - name: paths
        run: echo "GAMEKIT_STATE_DIR=$RUNNER_TEMP/gamekit-state" >> "$GITHUB_ENV"
      - name: check required secrets
        env:
          WIZ_LABS_GH_APP: ${{ secrets.WIZ_LABS_GH_APP }}
          GAMEKIT_ADMIN_TOKEN: ${{ secrets.GAMEKIT_ADMIN_TOKEN }}
          GAMEKIT_LAB_TOKEN: ${{ secrets.GAMEKIT_LAB_TOKEN }}
        run: |
          for name in WIZ_LABS_GH_APP GAMEKIT_ADMIN_TOKEN GAMEKIT_LAB_TOKEN; do
            eval "val=\${$name}"
            if [ -z "$val" ]; then
              echo "::error::missing secret $name (WIZ_LABS_GH_APP: the wiz-labs-code-grader App, checks out te-gamekit-service; the other two: SSM /gamekit/admin_token and /gamekit/lab_token)"
              exit 1
            fi
          done
      - name: checkout te-runner
        uses: actions/checkout@v5
      - name: app token
        id: app
        uses: ./.github/actions/app-token
        with:
          app: ${{ secrets.WIZ_LABS_GH_APP }}
      - name: checkout te-gamekit-service
        uses: actions/checkout@v5
        with:
          repository: wiz-training/te-gamekit-service
          token: ${{ steps.app.outputs.token }}
          path: gamekit
      - name: setup python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: round trip
        env:
          GAMEKIT_ADMIN_TOKEN: ${{ secrets.GAMEKIT_ADMIN_TOKEN }}
          GAMEKIT_LAB_TOKEN: ${{ secrets.GAMEKIT_LAB_TOKEN }}
        run: |
          mkdir -p "$GAMEKIT_STATE_DIR"
          set +e
          out=$(python3 gamekit/service/roundtrip.py "$GAMEKIT_URL" "$GAMEKIT_ADMIN_TOKEN" "$GAMEKIT_LAB_TOKEN" canary --every 2>"$GAMEKIT_STATE_DIR/stderr")
          rc=$?
          set -e
          line=$(printf '%s\n' "$out" | grep '^GAMEKIT_CANARY=' | tail -n 1)
          case "$line" in
            GAMEKIT_CANARY=ok:*) outcome=ok ;;
            GAMEKIT_CANARY=degraded:*) outcome=degraded ;;
            *) outcome=error ;;
          esac
          printf '%s' "$outcome" > "$GAMEKIT_STATE_DIR/outcome"
          {
            printf '### Canary: GameKit — `%s`\n\n' "$outcome"
            printf '`%s`\n\n' "${line:-no GAMEKIT_CANARY line (rc=$rc)}"
            if [ -s "$GAMEKIT_STATE_DIR/stderr" ]; then printf 'stderr: `%s`\n' "$(head -c 400 "$GAMEKIT_STATE_DIR/stderr")"; fi
          } > "$GAMEKIT_STATE_DIR/summary.md"
          cat "$GAMEKIT_STATE_DIR/summary.md" >> "$GITHUB_STEP_SUMMARY"
          cat "$GAMEKIT_STATE_DIR/summary.md"
          [ "$outcome" = ok ]
      - name: report issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          outcome=$(cat "$GAMEKIT_STATE_DIR/outcome" 2>/dev/null || echo "")
          case "$outcome" in
            degraded|error) ;;
            *) exit 0 ;;
          esac
          today=$(date -u +%Y-%m-%d)
          gh label create canary --description "Nightly lab canary failure" --color d93f0b 2>/dev/null || true
          existing=$(gh issue list --state open --label canary --search "\"GameKit\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file "$GAMEKIT_STATE_DIR/summary.md"
          else
            gh issue create --label canary --title "canary $today: $outcome on GameKit" --body-file "$GAMEKIT_STATE_DIR/summary.md"
          fi
