name: lint
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:   # build.yml runs this on the tagged sha before it publishes
jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      # Gate complexity so it can't regress; thresholds pass today (worst functions are C).
      - run: xenon --max-absolute C --max-average B wizlab
      - run: radon cc wizlab -s -a   # report in the log; xenon above is the gate
      - run: python tests/test_wizlab.py
      - run: python reaper/test_reap_orphans.py
      - run: python test_entrypoint.py
      # The repo is public: a credential in a tracked file is published the moment it lands.
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: secret
          exit-code: "1"
