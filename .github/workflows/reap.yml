name: reap-orphans
# Out-of-band reaper: daily, discovers session ids tenant-side (`lab-<12 chars>@` Wiz users and
# `lab-<12 chars>*` `_SWEEP_TYPES` resources whose earliest known `createdAt` is older than
# `REAP_TENANT_MIN_AGE_H`: a lab never runs 24 h, so anything older is residue), unions them with
# stopped `tid:<tenant>` `labPlayReports` sessions in the rolling 48h window and `REAP_SESSIONS`, and
# reaps each session's Wiz footprint and the Wiz user its SSO login minted (via the baked-in reaper +
# wizlab).
# Commit mode has one source per trigger: a manual run deletes iff its `commit` box is ticked (it is
# by default; untick for a dry run), the schedule deletes iff repo variable REAP_COMMIT=true. Neither
# overrides the other. A dry run reports the backlog and leaves it. A run is red only when a session
# left residue no later pass clears (wizlab exit 3/5) or a tenant's discovery could not be read;
# deferrals (an Outpost mid-uninstall) are green.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      commit:
        description: "Delete (untick for a dry run)"
        type: boolean
        default: true
      sessions:
        description: "Manual session ids to reap (comma-separated), unioned with tenant-side and labPlayReports discovery"
        type: string
        default: ""
      tenant:
        description: "Tenant the manual sessions are reaped under (a REAP_TENANTS key; empty = the first)"
        type: string
        default: ""
jobs:
  reap:
    runs-on: ubuntu-24.04
    # Floating tag: build.yml advances :reap only after the versioned image is smoke-tested and pushed,
    # so the reaper never names an unbuilt tag; rollback = pin vX.Y.Z on this line for one cycle.
    container: ghcr.io/wiz-training/te-runner:reap
    steps:
      - name: reap orphans
        env:
          INSTRUQT_TOKEN: ${{ secrets.INSTRUQT_TOKEN }}
          # Code-lab pool claims live in te-code-labs; without the App secret, stopped code-lab plays leak slots.
          WIZ_LABS_GH_APP: ${{ secrets.WIZ_LABS_GH_APP }}
          # One line and one secret pair per tenant; the tag swept is tid:<key lower-cased>.
          REAP_TENANTS: TBCMP,TE
          # A lab never runs 24 h, so anything older is residue.
          REAP_TENANT_MIN_AGE_H: "24"
          WIZ_TBCMP_CLIENT_ID: ${{ secrets.WIZ_TBCMP_CLIENT_ID }}
          WIZ_TBCMP_CLIENT_SECRET: ${{ secrets.WIZ_TBCMP_CLIENT_SECRET }}
          WIZ_TE_CLIENT_ID: ${{ secrets.WIZ_TE_CLIENT_ID }}
          WIZ_TE_CLIENT_SECRET: ${{ secrets.WIZ_TE_CLIENT_SECRET }}
          REAP_SESSIONS: ${{ inputs.sessions }}
          REAP_SESSIONS_TENANT: ${{ inputs.tenant }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then MODE="${{ inputs.commit }}"; else MODE="${{ vars.REAP_COMMIT }}"; fi
          COMMIT=""; [ "$MODE" = "true" ] && COMMIT="--commit"
          echo "commit mode: ${COMMIT:-dry-run} (from ${{ github.event_name }})"
          python /opt/reaper/reap_orphans.py $COMMIT
