name: reap-orphans
# Out-of-band reaper: daily, finds stopped tagged lab sessions and reaps their Wiz footprint + Keycloak
# user (via the baked-in reaper + wizlab).
# Commit mode has one source per trigger: a manual run deletes iff its `commit` box is ticked (it is
# by default; untick for a dry run), the schedule deletes iff repo variable REAP_COMMIT=true. Neither
# overrides the other. Every run is green either way; a dry run reports the backlog and leaves it.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      commit:
        description: "Delete (untick for a dry run)"
        type: boolean
        default: true
      sessions:
        description: "Manual session ids to reap (comma-separated), bypassing the tag/window filter"
        type: string
        default: ""
jobs:
  reap:
    runs-on: ubuntu-latest
    container: ghcr.io/wiz-training/te-runner:v0.1.57 # build.yml refuses a tag this line does not pin
    steps:
      - name: reap orphans
        env:
          INSTRUQT_TOKEN: ${{ secrets.INSTRUQT_TOKEN }}
          WIZ_TBCMP_CLIENT_ID: ${{ secrets.WIZ_TBCMP_CLIENT_ID }}
          WIZ_TBCMP_CLIENT_SECRET: ${{ secrets.WIZ_TBCMP_CLIENT_SECRET }}
          LAB_KEYCLOAK_ENDPOINT: ${{ secrets.LAB_KEYCLOAK_ENDPOINT }}
          LAB_KEYCLOAK_REALM: ${{ secrets.LAB_KEYCLOAK_REALM }}
          LAB_KEYCLOAK_ADMIN_USER: ${{ secrets.LAB_KEYCLOAK_ADMIN_USER }}
          LAB_KEYCLOAK_ADMIN_PWD: ${{ secrets.LAB_KEYCLOAK_ADMIN_PWD }}
          REAP_SESSIONS: ${{ inputs.sessions }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then MODE="${{ inputs.commit }}"; else MODE="${{ vars.REAP_COMMIT }}"; fi
          COMMIT=""; [ "$MODE" = "true" ] && COMMIT="--commit"
          echo "commit mode: ${COMMIT:-dry-run} (from ${{ github.event_name }})"
          python /opt/reaper/reap_orphans.py $COMMIT
