name: secrets-sync
# Manual-only sync from AWS SSM Parameter Store (`/te-labkit/*` + `/gamekit/{admin,lab,super}_token`)
# to Instruqt `wiz` team secrets. Static IAM keys until the AWS account has a GitHub OIDC provider.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (print planned upserts without mutating Instruqt)"
        type: boolean
        default: true
      only:
        description: "Comma-separated Instruqt secret names to sync (empty = all 16)"
        type: string
        default: ""
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-24.04
    concurrency:
      group: secrets-sync
      cancel-in-progress: false
    steps:
      - name: check required secrets
        env:
          INSTRUQT_TOKEN: ${{ secrets.INSTRUQT_TOKEN }}
          AWS_SSM_SYNC_ACCESS_KEY_ID: ${{ secrets.AWS_SSM_SYNC_ACCESS_KEY_ID }}
          AWS_SSM_SYNC_SECRET_ACCESS_KEY: ${{ secrets.AWS_SSM_SYNC_SECRET_ACCESS_KEY }}
        run: |
          if [ -z "$AWS_SSM_SYNC_ACCESS_KEY_ID" ] || [ -z "$AWS_SSM_SYNC_SECRET_ACCESS_KEY" ]; then
            echo "::error::missing AWS credentials: set both AWS_SSM_SYNC_ACCESS_KEY_ID and AWS_SSM_SYNC_SECRET_ACCESS_KEY"
            exit 1
          fi
          if [ -z "$INSTRUQT_TOKEN" ]; then
            echo "::error::missing secret INSTRUQT_TOKEN"
            exit 1
          fi
      - name: checkout te-runner
        uses: actions/checkout@v5
      - name: setup python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: install boto3
        run: pip install boto3
      - name: sync team secrets
        env:
          INSTRUQT_TOKEN: ${{ secrets.INSTRUQT_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_SSM_SYNC_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SSM_SYNC_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
          DRY_RUN: ${{ inputs.dry_run }}
          ONLY: ${{ inputs.only }}
        run: |
          set --
          if [ "$DRY_RUN" = "true" ]; then set -- "$@" --dry-run; fi
          if [ -n "$ONLY" ]; then set -- "$@" --only "$ONLY"; fi
          python3 scripts/secrets_sync.py "$@"
