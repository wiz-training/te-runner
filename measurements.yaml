    external_id: bare_name
  - cloud: aws
    wiz_type: SERVERLESS
    native_type: lambda
    instruqt_service: [lambda]
    resource: aws_lambda_function
    graph_min: 7.0
    crv2_min: 12.5
    first_seen: true
