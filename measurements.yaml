  - {cloud: aws, wiz_type: POLICY_STATEMENT, graph_min: 5.8}
  - {cloud: aws, wiz_type: NETWORK_INTERFACE, graph_min: 7.0}
  - {cloud: aws, wiz_type: HOSTED_TECHNOLOGY, graph_min: 8.3, note: technologies detected on a container image}
  - {cloud: aws, wiz_type: ENDPOINT, graph_min: 9.5, note: the listener URL; slowest kind measured}
  - {cloud: aws, wiz_type: EXCESSIVE_ACCESS_FINDING, graph_min: 5.8}
  - cloud: gcp
    wiz_type: CONFIGURATION_FINDING
    graph_min: 3.0
    note: also queryable as configurationFindings, ~10 min later
  - cloud: gcp
    wiz_type: ACCESS_ROLE_BINDING
    graph_min: 4.7
    note: 'every IAM binding; <role>##<project>##<sha256>, sometimes ##resourceLevel'
  - cloud: gcp
    wiz_type: HOSTED_TECHNOLOGY
    graph_min: 11.1
  - cloud: gcp
    wiz_type: HOST_CONFIGURATION_FINDING
    graph_min: 13.9
    note: present WITHOUT a sensor, unlike the AWS run

# ---------------------------------------------------------------------------------------------------
# What a cloud connector never surfaced. An absence is as load-bearing as an arrival time: it tells an
# author not to design a challenge around it, which is the cheapest possible moment to learn it.
# ---------------------------------------------------------------------------------------------------
absent:
  aws:
    kubernetes:
      surfaced: false
      note: >
        Zero KUBERNETES_* entities of any kind for a live k3s cluster running a workload. The host is an
        ordinary VIRTUAL_MACHINE; isContainerHost is false and typeFields.kubernetesCluster is null,
        identical to a cluster-less neighbour. Grading anything about a cluster needs the Sensor or a
        Kubernetes connector, which a cloud connector does not deploy. That is a tier decision.
    iam_instance_profile:
      surfaced: false
      note: Wiz models the role, not the wrapper. No entity corresponds to aws_iam_instance_profile.
    vulnerability_findings:
      surfaced: false
      note: >
        Needs disk scanning or the Sensor, not a connector alone. ECR BASIC scanning found zero
        vulnerabilities on a stock image. Enhanced scanning was unavailable, but NOT permanently: see
        dev_lab_service_gaps below.

  gcp:
    kubernetes:
      surfaced: false
      note: 'Zero KUBERNETES_* entities for a live k3s cluster running a two-replica nginx Deployment on the node''s port 80.
        isContainerHost false, kubernetesCluster null. Identical to the AWS result, so this is the cloud connector''s reach
        and not either cloud''s.

        '
    vulnerability_findings:
      surfaced: false
      note: >
        needs disk scanning or the Sensor; 55 HOSTED_TECHNOLOGY on the image and no CVEs. TRUE FOR A
        CONNECTOR-ONLY LAB ONLY: with a VCS connector on a repo, CVEs surface in ~15 min -- see
        findings.gcp.vulnerability_findings.
    data_findings:
      surfaced: false
      note: >
        DSPM is its own integration even with data_scanning true on the module. TRUE FOR A
        CONNECTOR-ONLY LAB ONLY: with the data_scanning role bound and a custom classifier they do
        surface -- see findings.gcp.data_findings.
    excessive_access_finding:
      surfaced: false
      note: 'DIFFERS FROM AWS, which raised one within 5.8 min for an equivalent over-broad role. roles/editor on a service
        account produced an ACCESS_ROLE_BINDING and no excessive-access finding in 44 minutes.

        '
    policy_statement:
      surfaced: false
      note: DIFFERS FROM AWS (14 there). GCP IAM has no statement objects; the binding is the unit.
    endpoint:
      surfaced: false
      note: DIFFERS FROM AWS. Neither the LB's :80 nor the Cloud Run HTTPS URL became an ENDPOINT.
    load_balancer_parts:
      surfaced: false
      note: 'url_map, target_http_proxy, health_check and global_address are not modelled as resources at all. A load balancer
        is its forwarding rule and backend service and nothing else.

        '

# ---------------------------------------------------------------------------------------------------
# Deletion. The reason every resource assertion scopes to an id rather than to an account.
# ---------------------------------------------------------------------------------------------------
lifecycle:
  aws:
    status_reflects_reality: false
    note: >
      `status` reads Active on entities that no longer exist in the cloud, including entities that
      already carry a deletedAt. Never grade liveness on it.
    active_after_destroy_min_hours: 37       # lower bound, ground-truthed against AWS; not an SLA
    observed_unchanged_after_destroy_min: 82  # 33 observations, nothing moved; stopped, not concluded
    deleted_at_lag: days                     # a daily pass, clustering ~11:57-11:59 UTC
    deleted_at_trustworthy: true
    ingestion_can_create_dead_entities: true
    ingestion_note: >
      A NAT gateway deleted at 02:49Z was FIRST SEEN by Wiz 26 minutes AFTER its deletion, because the
      cloud API still described it. So a fresh firstSeen is not evidence the resource exists.
    cleanup_challenge_gradable: false
    verify: |
      destroy the root, then poll both planes for the same externalIds and watch status / deletedAt

  gcp:
    # NOT MEASURED, and stated rather than omitted: an absent section reads as "the AWS figures apply".
    # Nothing here is inherited from AWS.
    measured: false
    verify: |
      destroy the root, then poll both planes for the same externalIds and watch status / deletedAt
    note: >
      AWS held destroyed resources Active for ~37 hours with deletedAt null. Whether GCP behaves the same
      is unknown. Until it is measured, scope a GCP resource assertion to an externalId and do not grade
      liveness on status on either cloud.

# ---------------------------------------------------------------------------------------------------
# Outpost control plane. Not an indexing plane: OutpostStatus transitions and the two-phase deploy they
# depend on. Keys are grouped prerequisites -> failure states -> convergence -> queries. Key PATHS are
# cited across tracks, so reorder freely but do not rename or re-nest them.
# ---------------------------------------------------------------------------------------------------
outpost_lifecycle:
  aws:
    tenant: TS_PROD
    deployment_type: Automated        # useWizServiceAccount: true; createOutpost via wizlab outpost ensure

    # -- Prerequisites -----------------------------------------------------------------------------
    cluster_requires_bound_connector: true
    # The deploy has two phases and phase 1 alone converges to nothing. Phase 1: the orchestrator TF
    # module + createOutpost. Phase 2: a Cloud Connector bound to the Outpost via `authParams.outpostId`
    # on createConnector -- the only binding field. No extraConfig key, no wizlab verb.
    phase2_roles:                     # both in the workload account; names fixed by Wiz, do not stem them
      read_only: WizAccess-Role       # authParams.customerRoleARN; trusts the tenant delegator + externalId
      scanner: WizScannerRole-<suffix>  # authParams.diskAnalyzer.scanner.roleARN
    # One vendor template declares both: wiz-aws-standard-outpost.json, as WizAccessRoleReadOnly
    # (RoleName from its WizRoleName param) and WizScannerRole-${RoleSuffix}. Its policies are
    # ManagedPolicy resources and must be attached, not inlined -- the read-only set spans 4 documents
    # against a 10240-byte aggregate inline cap per role. The scanner role trusts
    # arn:aws:iam::<orchestratorAccount>:role/WizOrchestratorNodePoolRole with sts:ExternalId, so it
    # requires phase 1. `cloudformation` is absent from the lease services allowlist, making the vendor's
    # recommended StackSet path an explicit deny. The vendor Terraform (the wiz-aws-native-terraform
    # module) emits the read-only role ONLY, so the scanner role has to be authored; it needs one
    # AWS-managed policy, job-function/ViewOnlyAccess, and nothing custom.
    # `wizlab role ensure` writes a trust policy identical to the read-only template's, permissions none.
    binding_has_no_readback: true
    # authParams is write-only on Connector: neither outpostId nor diskAnalyzer.scanner.roleARN reads
    # back. `Connector.outpost { id name }` is the only field distinguishing a bound connector from an
    # unbound one, and both reach status CONNECTED. Nothing Wiz-side validates the scanner ARN it is
    # handed either, so assert that role in the cloud account.
    scan_needs_on_demand_trigger: true
    scan_trigger_mutation: requestConnectorScan   # input {id, omitDataScan: false, enableArchivedReposCodeScan}
    # requestConnectorEntityScan is NOT a trigger: it returns OK and registers a 1-second CLOUD_EVENT
    # connectorScan that dispatches nothing to the node pool.
    scan_trigger_quota_is_per_tenant: true
    # 1 per 10 min, 5 per day, 30 per month per TENANT, shared across concurrent leases and with
    # inventory rescans. A solver gets one attempt and must not loop; grading a disk scan caps fleet
    # concurrency at 5 plays/day.

    # -- Failure & incomplete states ---------------------------------------------------------------
    initialized_proves: object_registered_only
    # INITIALIZED is reachable with a roleARN naming an account that cannot exist, with errorCode null
    # and clusters null. It means Wiz is ready to start trying, not that the role is assumable or that
    # any AWS resource exists, so `--require initialized` also passes for a learner who never applied the
    # Terraform. Grade the AWS side (role inspect) for "deployed", CONNECTED for "healthy".
    connected_proves: region_cluster_with_heartbeat   # clusters[].lastHeartbeat populated
    unbound_outpost_symptoms:         # phase 1 applied, valid assumable role, no connector bound
      status: INITIALIZED             # indefinitely; errorCode stays null
      clusters: null
      scans_attempted: 0              # 0 successful AND 0 failed -- all-zero is the tell it never tried
      shi: medium                     # "Outpost With No Connected Connectors ... this Outpost is in idle mode"
    ui_active_is_not_connected: true
    # The GUI reads Active while the API holds INITIALIZED with clusters null: UI wording tracks the
    # connector and `enabled`, not OutpostStatus. Grade the enum, and never publish a learner-facing
    # status table equating the UI word with the API state.
    connected_without_scans_fraction: 4/7   # CONNECTED AWS Outposts reporting 0 scans over a 7d window
    # CONNECTED and "has scanned" are independent assertions. A CONNECTED Outpost with a bound connector
    # attempts no disk scan until one is triggered: the SCHEDULED connector scan inventories the account
    # and dispatches nothing to the node pool.
    role_last_used_is_useless: true
    # iam Role.RoleLastUsed reads NEVER on all five Wiz roles while Wiz is mid-CreateCluster in that
    # account. It lags past any window a check or diagnosis runs in; never infer non-assumption from it.
    delete_requires_uninstall: true
    # deleteOutpost on a live (INITIALIZED) Outpost returns a server-side "internal error" with a request
    # id -- not a validation error -- and fails again while UNINSTALLING. The only order that works is
    # uninstall -> poll to UNINSTALLED -> delete. `wizlab outpost delete` does this (--timeout 600
    # default, exits 0 on a stuck record because the EKS infra dies with the lease).
    daily_reaper_covers_outposts: false
    # The out-of-band audit-log reaper derives delete<Type> generically, so it hits that same internal
    # error and ALERTS instead of reaping. A leftover Outpost is a human alert, not a silent leak.

    # -- Convergence & latencies -------------------------------------------------------------------
    create_status: INITIALIZING       # returned synchronously by createOutpost
    initializing_to_initialized_max_min: 4   # n=1, with a non-assumable role, so no EKS is ever built
    time_to_connected_min: [21.4, 22] # n=2, from the connector bind; never from createOutpost
    connect_ladder_min:               # from the connector bind, n=1
      wiz_cluster_object: 6
      in_account_CreateCluster: 8
      eks_control_plane_ACTIVE: 20    # 9 node groups
      status_CONNECTED: 22
    error_to_connected_min: 3.2       # n=1, ERROR -> CONNECTED after the regional-resources re-run on a
    # repaired node role. An order of magnitude under time_to_connected_min: the EKS control plane already
    # exists, so only the node groups are built. The re-run against an unrepaired trust re-fails instead.
    # A task grading CONNECTED needs more than 22 min of budget and an idle stop longer than the wait:
    # the learner touches nothing throughout. The docs' "up to 24 hours" is a ceiling, not an expectation.
    time_to_first_scan_min: 5         # n=1, requestConnectorScan -> resourceScanResults SUCCESS
    uninstall_to_uninstalled_min:
      from_initialized: 1.7           # n=1, no real infra to tear down
      from_initializing: 5.9          # n=1, 3.4x slower in the same no-infra case; not a tight bound
      from_connected: [20, 33]        # n=2, real EKS; UNINSTALLING persists past +19, UNINSTALLED by +20.
      # `wizlab outpost delete` waits 600s, so a lab's final reap defers a CONNECTED outpost to the
      # out-of-band sweep; a second `outpost delete` after UNINSTALLED completes it in seconds.
    transient_snapshot: true
    # A disk scan appears in the workload account as an EBS snapshot alive for seconds (0->1->0 inside
    # 16s), so snapshot count is not a usable poll signal and leaves nothing to reap.

    # -- Queries -----------------------------------------------------------------------------------
    scan_proof_query: resourceScanMetricsTrend
    # The only OUTPOST-SCOPED scan assertion: it counts scans performed BY one outpostId, where
    # cloudResources/vulnerabilityFindings answer "is the account inventoried" (the connector's job).
    # Args (startDate, endDate, outpostId: String! -- not ID!); dataPoints are one bucket per UTC day, so
    # sum the window. `wizlab outpost inspect --require scanned` is this query. `wizlab instance inspect`
    # is no substitute: it is cloudResources totalCount and prints the word "scanned", which a lease EC2
    # satisfies while the Outpost's own scan count is 0.
    verify: |
      wizlab outpost ensure --name lab-<id> --role-arn arn:aws:iam::123456789012:role/nonexistent
      wizlab outpost inspect --name lab-<id> --require initialized   # exit 1, then 0 within ~4 min
      time wizlab outpost delete --name lab-<id>                     # uninstall -> wait -> delete, exit 0
      # 78 successful scans -> exit 0; a CONNECTED-but-idle Outpost -> exit 1
      wizlab outpost inspect --name Stan-Outpost-Standalone-Test --require scanned --lookback-days 7
      wizlab outpost inspect --name CT-Outpost --require scanned --lookback-days 7
      # time_to_connected_min + cluster_requires_bound_connector, on a lease with phase 1 applied:
      wizlab outpost inspect --require connected                     # exit 1 -- no connector, no cluster
      # then createConnector(type "aws", authParams{outpostId, customerRoleARN, diskAnalyzer.scanner.roleARN})
      wizlab outpost inspect --require connected                     # exit 0 within ~22 min
      wizlab outpost inspect --require scanned                       # exit 1 -- CONNECTED triggers nothing
      # then requestConnectorScan(id: <connector>, omitDataScan: false) -- spends per-tenant quota
      wizlab outpost inspect --require scanned                       # exit 0 within ~5 min
      # error_to_connected_min, on an Outpost whose node role EKS could not pass:
      wizlab outpost inspect --require connected                     # exit 1 -- status=ERROR
      wizlab role inspect --cloud aws --role-name <nodeRole> --trusts-service ec2.amazonaws.com  # exit 1
      # repair the trust, then re-run provisioning (menuitem "Update All Clusters Regional Resources")
      wizlab outpost ensure --role-arn <orchestratorRoleArn> --region us-east-1
      wizlab outpost inspect --require connected                     # exit 0 within ~4 min

# ---------------------------------------------------------------------------------------------------
# Tag filtering. The only lease-scoping mechanism that works at all, since AWS-side enumeration is
# impossible on these leases: tag:GetResources is SCP-denied.
# ---------------------------------------------------------------------------------------------------
tag_filtering:
  aws:
    cloud_resources_v2: filterBy.tag.containsAll
    graph_search: where.tags.TAG_CONTAINS_ALL     # requires type: ["ANY"]; an empty type list is rejected
    configuration_findings: resource.tag.containsAll   # undocumented but honoured
    caveats:
      - "Reaches only TAGGED resources -- 51 of 171 entities. Findings, policies, ENIs, the running task
         and the ECR image carry no tags and cannot be found this way."
      - "Lease-scoped, not generation-scoped: a predecessor apply on a recycled account lands in the same
         result set. Scope to an externalId when the question is about THIS run."
      - "filterBy.tag is not filterBy.project.tag."
      - "Verify any tag filter with a negative control. A filter that is silently ignored returns
         everything, which looks exactly like success."

  gcp:
    cloud_resources_v2: filterBy.tag.containsAll
    graph_search: where.tags.TAG_CONTAINS_ALL
    configuration_findings: resource.tag.containsAll
    key_casing: lowercase only; GCP rejects an uppercase label key or value, so the AWS LabKitSweep marker is not portable
    reach: 17 of 53 declared resources
    caveats:
    - Reaches only LABELLABLE resources -- 32% here against AWS's 70%. The whole network layer (network, subnets, firewalls,
      router, NAT), the whole IAM layer (service accounts, custom role, 45 bindings), most of the load balancer, the KMS key
      ring, the log sink, the container image and every derived entity accept no label at all.
    - 'Lease-scoped, not generation-scoped, and it bit visibly: three ENCRYPTION_KEY entities came back, one per apply, because
      a KMS key ring cannot be deleted.'
    - 'Verify with a negative control AND confirm the returned nodes carry the label. Both were done here: bogus value -> 0
      on all three planes in all 18 rounds, and 17 of 17 nodes carried it.'
    note: GCP calls these labels, not tags. The filter keys are identical to AWS; the value is lowercase-only.

# ---------------------------------------------------------------------------------------------------
# Findings that a connector alone does raise, for the one case measured.
# ---------------------------------------------------------------------------------------------------
findings:
  aws:
    public_bucket:
      first_finding_min: 6.0
      high_fails: 7                # against 0 on an otherwise identical private bucket
      discriminator: >
        Compare HIGH-severity FAIL count, not the raw finding count. Raw counts were 48 public vs 41
        private -- a difference too small to grade on, while 7 vs 0 is unambiguous.

  gcp:
    public_bucket:
      first_finding_min: 3.2
      first_queryable_min: 13.0
      high_fails: 1
      rule: StorageBucket-007
      discriminator: 'Name StorageBucket-007 explicitly. There is exactly ONE HIGH FAIL here against AWS''s seven, so "at least
        one HIGH FAIL" is true but rests on a single finding.

        '
    other_high_fails:
    - resource: compute instance
      rule: Compute-010
      name: should not have a public IP address
    - resource: compute instance
      rule: Compute-013
      name: Shielded VM should be fully enabled
    - resource: cloud function
      rule: Serverless-018
      name: should not be publicly accessible
    cloud_run_no_high:
      note: An identical allUsers invoker binding on Cloud Run raised NO HIGH -- four MEDIUM/LOW only. So a public-serverless-endpoint
        challenge is gradeable at HIGH on a Cloud Function and is not on Cloud Run.
    vulnerability_findings:
      solver_budget_min: 25
      note: >
        Three planes at very different speeds, measured on gcp-wizcraft-bootcamp-201. FASTEST is code: a
        VCS connector on the repo raised CVE-2025-55182 with firstDetectedAt ~15 min after the baseline
        push, so a solver CAN grade this -- budget 25 min. That asset is a REPOSITORY_BRANCH and carries
        NO cloud-subscription scope, so a vulnerabilityFindings filter on subscriptionExternalId never
        returns it; filter by CVE and match the repo name. SLOW planes, do not budget for them: a GKE
        node disk scan produced 357 findings but no CVE for a container deployed after the snapshot, and
        the app's own CONTAINER_IMAGE was a graph node with ZERO findings after 9h (registry scanning is
        a console-only tenant setting, weekly by default).
        Re-establish: labkit check-vuln-finding --cve <cve> --project <p> --repo <owner/repo>
    data_findings:
      solver_budget_min: null       # null = NOT solver-gradeable; this plane is multi-day
      bound_max_min: 520
      note: >
        Surfaces with the vendor module's data_scanning role bound and a custom classifier. An on-demand
        data scan requested 03:18:24Z was observed as a finding by 11:58Z: <=8h40m, an upper BOUND and
        not a delta (n=1). It cannot be narrowed from the API -- DataFinding exposes no timestamp field
        at all, no firstSeen/createdAt/detectedAt -- so tightening it means polling. A challenge that
        grades this cannot pass inside a lease window. On-demand scans are rate limited to one per 10 min
        per connector and an inventory rescan resets that clock, so request the data scan last and alone.
        Re-establish: connector.py rescan --account-id <p> --data-scan, then poll
        labkit check-data-finding --bucket <b>

# ---------------------------------------------------------------------------------------------------
# A denial on a dev lease is usually a gap in the dev track's own allow-list, not a fact about the cloud.
#
# Instruqt implements the sandbox's allowed-services list AS an org policy on the account, so the error for
# a service nobody added is indistinguishable from a hard organizational denial. Three things were recorded
# as impossible on that evidence and are one line in `tracks/<cloud>-dev/config.yml` plus a fresh lease.
# Check the list before concluding anything is unavailable, and classify a denial as one of: absent from the
# services list, a cloud API not enabled in the project, or a genuine org policy constraint named by id.
# ---------------------------------------------------------------------------------------------------
dev_lab_service_gaps:
  # Three causes, three very different remedies. Classifying a denial wrongly either kills a workable
  # track or promises a fix that takes a month.
  #
  #   config_gap    -- in Instruqt's allowed list, absent from OUR dev track. One line plus a fresh lease.
  #   platform_gap  -- not in Instruqt's allowed list at all. A support request; the docs say the
  #                    feasibility and security review "can take up to a month".
  #   org_policy    -- a constraint beyond either, named by id.
  #
  # The allowed list is published at
  # docs.instruqt.com/sandboxes/manage/cloud-services-and-regions/allowed-services-and-regions
  # and it is the thing to check FIRST, because Instruqt implements the per-track list as an org policy on
  # the account: the error for a service nobody added is indistinguishable from a hard denial. Names are
  # lowercase IAM service prefixes on AWS, full API hostnames on GCP, resource-provider namespaces on Azure.
  # A misspelling is silently denied rather than rejected -- see TODO 12 -- so copy the name, do not type it.
  aws:
    config: tracks/aws-dev/config.yml -> aws_accounts[0]
    config_gap:
      - field: regions
        current: [us-east-1]
        note: >
          The platform allows 29 AWS regions including us-east-2 and us-west-1/2. So "EC2 is denied outside
          us-east-1" is our own single-region declaration, not a platform limit -- a one-line add.
    platform_gap:
      - service: secretsmanager
        blocks: >
          RDS `manage_master_user_password`, the only way to stand up a database with no password in
          Terraform state. The measured fallback was `random_password` in state.
      - service: tag / resource-groups / resource-explorer-2
        blocks: >
          `tag:GetResources`, and with it any AWS-side enumeration of a sweep by tag. Wiz-side tag
          filtering works on all three planes and is the available substitute.
      - service: inspector2
        blocks: ECR enhanced scanning, and with it a vulnerability track built on registry scanning.
  gcp:
    config: tracks/gcp-dev/config.yml -> gcp_projects[0]
    config_gap:
      - service: servicenetworking.googleapis.com
        unblocks: private service access, and so a private IP for Cloud SQL.
      - service: firestore.googleapis.com
        unblocks: Firestore.
      - service: certificatemanager.googleapis.com
        unblocks: managed certificates, and so HTTPS on a load balancer.
    platform_gap:
      - service: apigateway.googleapis.com
        blocks: >
          API Gateway. A Cloud Run URL serves as an HTTP endpoint without it. Note apigee and apihub ARE
          allowed and are different products.
    note: >
      secretmanager.googleapis.com is enabled here while AWS's secretsmanager is not allowed at all, so the
      credential-in-state problem that blocked RDS should not exist for Cloud SQL. The same problem is
      solvable on one cloud and not the other, and the asymmetry is the platform's allow-list rather than
      anything about the clouds.
