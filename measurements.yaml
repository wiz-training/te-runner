    graph_min: 7.0
    crv2_min: 12.5
    first_seen: true
    created_at: false
    external_id: aws_id
  - cloud: aws
    wiz_type: FIREWALL
    native_type: securityGroup
    instruqt_service: [ec2]
    resource: aws_security_group
    graph_min: 7.0
    crv2_min: 12.5
    first_seen: true
    created_at: false
    external_id: aws_id
  - cloud: aws
    wiz_type: ROUTE_TABLE
