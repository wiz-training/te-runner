# What Wiz sees, how long it takes, and what a check must compare against.
#
# This file exists so a track author stops counting seconds. Every figure below was measured on one
# apply of the whole menu -- 73 AWS resources, one connector, three planes polled from a single
# connector-created timestamp -- so the numbers are mutually consistent rather than gathered per track
# and silently incomparable.
#
# HOW TO USE IT. Find the kind a check asserts on, take `solver_budget_min` for the plane that check
# queries, and use it. Do not re-derive from `graph_min`/`crv2_min` -- the margin is already in it, and
# the reason for the margin is recorded beside it.
#
# WHAT IT IS NOT. Every number is n=1. It is a reference, not an SLA, and this repo's own note is that
# successive runs here keep getting slower. `verify` on each section is the command that re-establishes
# the figure; a fact nobody can re-check is a fact nobody can ever delete. When a verify run disagrees,
# change the number -- do not annotate it.

meta:
  n: 1
  clouds: [aws, gcp, azure]   # a cloud appears here only once its rows AND its plane timings exist
  resources_measured:
    aws: 73
    gcp: 53
    # azure is the connector-101 essentials only -- one VM plus the connector and discovery plane --
    # not a kitchen-sink sweep. The Entra lock (bricks/azure/NOTES.md) blocks the identity-scanning
    # legs that would surface IAM/policy kinds, so the id-shape catalogue aws/gcp have is not yet
    # possible on azure. What is here was measured on one apply; see the azure `verify` below.
    azure: 1
  # Not a date. A date says a figure is old without saying whether it is wrong; the command says which.
  verify: |
    cd research/kitchen-sink && terraform apply
    python3 -m labkit tf-apply --cloud aws --dir bricks/aws     # the Wiz identity
    python3 bricks/connector.py --cloud aws create --account-id <acct>
    # then poll both planes from the connector-created timestamp; see research/kitchen-sink/wiz-sweep.md

# ---------------------------------------------------------------------------------------------------
# The planes. Which one a check queries is worth more than any per-kind figure: the same resource is
# ~5 minutes cheaper on the graph than on the inventory table.
# ---------------------------------------------------------------------------------------------------
planes:
  aws:
    graph_search:
      first_entity_min: 5.8
      plateau_min: 9.5
      solver_budget_min: 16
      # `firstSeen` is a field ON the entity here, never a key inside `properties` -- `properties.firstSeen`
      # is null on every entity of every kind. Selecting only `properties` makes a populated field read as
      # absent, which is the expensive direction: it looks like "not indexed yet" rather than a query bug.
      time_field: firstSeen
      filterable_on_time: false     # every `where` attempt on a time field returned an internal error
      supports_include_deleted: false
      reads_tags_back: false        # filters on tags correctly, but `properties.tags` is null
    cloud_resources_v2:
      # Two discrete waves with nothing between them, not a trickle. Which wave a kind lands in is per-kind
      # below, and it is the difference between a 10-minute budget working and timing out.
      wave_one_min: 7.5             # IAM, ECS/ECR, KMS, policies
      wave_two_min: 12.5            # every VM, VPC, subnet, SG, bucket, RDS, Lambda, ALB, gateway
      solver_budget_min: 20
      time_fields: [firstSeen, createdAt, updatedAt]
      filterable_on_time: true      # firstSeen: {after: <ts>} returned exactly one run's resources
      supports_include_deleted: true    # and excludes deleted by default
    configuration_findings:
      # The fastest plane, and it beats the resource it describes onto the inventory table.
      first_finding_min: 5.1
      solver_budget_min: 12
      scope_note: >
        Scope nests under `resource`; there is no top-level cloudAccount filter. Needs the
        read:cloud_configuration scope, which is distinct from read:resources.
    connector_health:
      # Measured ROLE-FIRST (WizAccess-Role deployed, THEN the connector registered against its ARN) --
      # the connector-101 flow, distinct from the sweep above which created the connector first. With the
      # role already trusted, the connector went INITIAL_SCANNING -> CONNECTED and never touched ERROR.
      # ERROR is what a connector shows when Wiz cannot assume the role (missing/untrusted); role-first
      # skips it. CONNECTED is AWS's healthy status; wizlab `connector inspect --require healthy` asserts it.
      connected_min: [1.4, 3.0]    # INITIAL_SCANNING at +0, CONNECTED by +1.4m (30s polls), +2.3m and +3m (60s polls). n=3.
      solver_budget_min: 5         # covers the observed ceiling + margin; the connector self-heals, no rescan.
      # verify: after `role ensure`, `connector ensure --account-id <acct>`, then poll
      #   wizlab connector inspect --account-id <acct> --require healthy   # exit 1 until CONNECTED
      arn_patch_connected_min: [5.3, 9]  # REPAIR path only: ARN corrected on an existing ERROR connector →
      # ERROR→INITIAL_SCANNING→CONNECTED. ~2-5x slower than role-first, n=2. A repair-path solver budget
      # must be >= 15 min: solve→re-check completes in 13.5.
    cloud_resources:
      # The OLDER cloudResources plane `wizlab instance inspect` queries, on a never-connected sandbox
      # account with one t3.micro launched 52s after connector create. Slower than gcp and azure on the
      # VM leg; the 20-minute budget the twins carry holds.
      vm_after_connected_min: 9.5   # first VIRTUAL_MACHINE 9.5m AFTER CONNECTED. n=1, 30s polls.
      vm_after_create_min: 10.9     # ...i.e. 10.9m after connector create; 10.1m after the EC2 launch.
      solver_budget_min: 20
      # verify: `connector ensure --account-id <acct>`, launch an EC2 in a VPC (the sandbox has no default
      #   VPC and its SCP denies ssm:GetParameter, so `ec2 describe-images` finds the AMI), then poll
      #   `instance inspect --account-id <acct> --type VIRTUAL_MACHINE` -- exit 1 until >=1

  gcp:
    connector_health:
      # Measured IDENTITY-FIRST (vendor TF module binds the 5 fetcher roles to Wiz's managed SA, THEN
      # the connector is created) -- the gcp-connector-101 flow. GCP grants Wiz's OWN service account,
      # so there is no role to assume and no ERROR-on-missing-trust state to pass through.
      connected_min: [3.6, 5.5]    # last INITIAL_SCANNING at +3.6m, CONNECTED by +4.2m; second run +5.5m. n=2.
      vendor_module_terraform_floor: "1.12"
      # Build 2696 pulls its cloud-events submodule from an unpinned zip whose `reingestion_mode` validation
      # reads `x == null || contains(list, x)`; operators short-circuit only from Terraform 1.12, and the
      # module is validated even with cloud_events=false. Reproducer, exit 1 below 1.12 and `true` at 1.12+:
      #   echo 'null == null || contains(["a"], null)' | terraform console
      solver_budget_min: 7         # observed ceiling + margin; the connector converges alone, no rescan.
      # verify: apply template/infra/gcp/wiz-connector-roles, `connector ensure --cloud gcp
      #   --account-id <project id>`, then poll `connector inspect --cloud gcp --require healthy`
    cloud_resources:
      # The OLDER cloudResources plane -- the one `wizlab instance inspect` actually queries, which was
      # unmeasured on every cloud until this run. Distinct from cloud_resources_v2 below: do not reuse
      # that block's budget for an `instance inspect` check.
      vm_after_connected_min: [5.5, 9.3]   # first VIRTUAL_MACHINE 5.5-9.3m AFTER the connector hit CONNECTED
      vm_after_create_min: [9.7, 14.9]     # ...i.e. 9.7-14.9m after connector create. n=2, 60s polls.
      solver_budget_min: 20                # ceiling + margin; 28 (crv2) is the conservative fallback
      # verify: `instance inspect --account-id <project id> --type VIRTUAL_MACHINE` -- exit 1 until >=1
    graph_search:
      first_entity_min: 1.2
      plateau_min: 17.4
      solver_budget_min: 24
      time_field: firstSeen
      filterable_on_time: false
      supports_include_deleted: false
      reads_tags_back: true
      project_scope_filter: reverse CONTAINS from SUBSCRIPTION; a top-level subscriptionId matches only the SUBSCRIPTION
        entity and returns 1 node for a project holding 563
    cloud_resources_v2:
      wave_one_min: 8.8
      wave_two_min: 15.2
      wave_three_min: 21.9
      solver_budget_min: 28
      time_fields:
      - firstSeen
      - createdAt
      - updatedAt
      filterable_on_time: true
      supports_include_deleted: true
      project_scope_filter: cloudAccountV2.externalId.equals; misses ACCESS_ROLE entirely
    configuration_findings:
      first_finding_min: 3.2
      first_queryable_min: 13.0
      solver_budget_min: 20
      scope_note: 'resource.subscriptionId rejects a GCP project id in every shape with an internal error, not an empty
        page. resource.tag.containsAll and resource.cloudPlatform work. resource.externalId works and takes the
        gs://<bucket> shape; the bare bucket name returns totalCount=0 rather than an error. Re-establish with
        configurationFindings(filterBy: {resource: {externalId: {equals: ["gs://<bucket>"]}}}) against any indexed
        GCS bucket.

        '

  # Azure: n=1, ONE kind (a Standard_D2as_v5 VM in centralus). Not the multi-kind sweep aws/gcp got,
  # so there is no wave structure to record -- one entity cannot show waves. Measured from a single
  # connector-created timestamp (16:50:05Z) on Azure lease yhdc2hteibde, Wiz TBCMP/us100.
  azure:
    connector_health:
      # Connector left INITIAL_SCANNING and reached CONNECTED between +4.1m and +5.4m of create. The
      # RBAC role assignment (WizCustomRole + Reader) MUST exist first, or it goes ERROR instead --
      # so a challenge that grades "registered" must grade existence, not health (the --assert-exists
      # split). CONNECTED is Azure's healthy status; --assert-ok passes it.
      connected_min: 5.4
      # Second observation (azure-connector-101 validation, identity-first): [2.6, 3.1] -- roughly
      # 2.3m FASTER than the row above. Two runs disagree, so budget for the slower one; the spread
      # itself is the finding, and a lab must not print a countdown either number implies.
      connected_min_run2: [2.6, 3.1]
      solver_budget_min: 8        # covers the slower observation + margin. Was absent entirely.
    cloud_resources:
      # The OLDER cloudResources plane -- the one `wizlab instance inspect` queries. Unmeasured on
      # azure until the azure-connector-101 validation run. Distinct from cloud_resources_v2 below:
      # do not reuse that budget for an `instance inspect` check.
      vm_after_connected_min: [5.2, 6.3]   # first VIRTUAL_MACHINE 5.2-6.3m AFTER the connector hit CONNECTED
      vm_after_create_min: [8.4, 9.4]      # ...i.e. 8.4-9.4m after connector create. n=1, 60s polls.
      solver_budget_min: 20                # ceiling + margin; matches the gcp twin
      # Azure is slightly FASTER than gcp on both legs (gcp: [5.5, 6.6] / [9.7, 10.7]).
      # verify: `instance inspect --account-id <subscription id> --type VIRTUAL_MACHINE` -- exit 1 until >=1
    role_assignment_apply:
      # The vendor module's own gate, not a Wiz plane: time_sleep.wait_for_az_dataplane_custom_role
      # has create_duration 360s, so the apply cannot finish faster than ~6m however small the change.
      apply_min: 7.4              # measured 442s, 6 resources. n=1. Budget a task timeout well past it.
    graph_search:
      first_entity_min: 6.6       # the VM; connector virtualMachineCount went 0->1 by +7.2m
      solver_budget_min: 16       # VM at ~7m + margin; matches the aws graph budget. n=1, slower over time.
      # `firstSeen` is null ON the graph entity (as on aws/gcp); read the crv2 firstSeen for arrival.
      time_field: firstSeen
      external_id_case: >
        graphSearch externalId {EQUALS} is CASE-SENSITIVE and stores the fully LOWERCASED ARM resource
        path. The mixed-case path Terraform's azurerm_*.id emits does NOT match the graph leg -- emit
        lower(azurerm_linux_virtual_machine.<x>.id) so the fast graph plane hits. cloudResourcesV2
        equality IS case-insensitive, so the mixed-case path still matches there (the slower fallback).
    cloud_resources_v2:
      first_seen_min: 6.6         # crv2 firstSeen field = 16:56:39Z, +6.6m after create
      solver_budget_min: 16
      time_fields: [firstSeen]
    verify: |
      cd /tmp/az-measure && terraform apply   # vendor identity module (use_existing_service_principal
                                              # =true + wiz_app_object_id) + one centralus VM
      python3 bricks/connector.py --cloud azure create --account-id <sub> --tenant-id <arm-tenant>
      # then poll status (CONNECTED) and `resource --external-id <lower(vm-arm-id)>` from create time
  sensor:
    # Cloudless Runtime-Sensor lab (te-wiz-sensor-101): the sensor installs on an Instruqt `vm`
    # sandbox (real kernel + systemd -- a container cannot run its engine) and grades on the
    # `sensors`/`detections` planes, keyed by name = VM hostname = lab-<session_id>. n=2, two live
    # plays (s3sd84thneqa, njtac8zm3vdd). SensorStatus is ACTIVE/INACTIVE only.
    registration:
      install_to_active_min: [3.6, 4.9] # native install (systemd starts it) -> sensors(...).status ACTIVE
      solver_budget_min: 14            # solve_wait_active polls to 840s
      # A check cannot wait for INACTIVE: the sensor is absent from the plane until it registers, then
      # its first appearance already reads ACTIVE. Grade absence-then-ACTIVE, never a status transition.
    detection:
      trigger_to_queryable_min: [1.2, 2.2] # cat /proc/<pid>/mem -> detections(GENERATED_THREAT) totalCount>=1. n=2
      match_only_lag_min: [0.05, 0.07] # the MATCH_ONLY sibling lands with the GT (one keystroke, both rules)
      solver_budget_min: 8            # solve_trigger polls to 480s
      # Grade the Detection plane scoped by sensorId (resolved from name), keyed on matchedRuleName +
      # type. Never a rule id (tenant-specific) and never a Threat/Issue (tenant-wide anti-burst cap).
    verify: |
      # On a connected te-wiz-sensor-101 play, from the grader (dev access on, SSH to the vm):
      wizlab sensor ensure   # mint type:SENSOR SA; install on the vm with WIZ_API_CLIENT_ID/SECRET
      wizlab sensor inspect --require active                                        # -> 3.6m / 4.9m
      # trigger `cat /proc/$$/mem` on the vm, then:
      wizlab detection inspect --rule-name "Process memory dump via common utilities"    # GENERATED_THREAT
      wizlab detection inspect --rule-name "Process memory data file was accessed" --match-only

  workflow:
    # Automation Workflow labs. Graded planes are `automationWorkflows` (by name prefix) and
    # `automationWorkflowRuns` (by workflowId, then a step result's outboundEdge). Timings n=2, two live
    # plays. `published` is `enabled`: activeVersion/draftVersion/versions read null/0 on every workflow
    # in the tenant, so no version field can carry a grade.
    # A run outlives its workflow: after deleteAutomationWorkflow, automationWorkflowRuns filtered on the
    # dead workflowId still returns every run with step results. Runs carry no name, so the prefix sweep
    # cannot see them and they are no learner-visible leak.
    validation:
      # validateAutomationWorkflow checks field NAMES against the trigger payload schema and nothing
      # about null or key safety, so a clean publish does not predict a clean run.
      rejects_unknown_field: true          # "field 'x' does not exist in expression" -> ensure --dry-run exit 1
      rejects_unguarded_traversal: false   # tags.owner on a map, a.b.c on a nullable parent: both exit 0
      rejects_null_coalesce: true          # `??` -> "syntax error: unexpected token '?'"; use .get(k, d) / .orValue()
      verify: |
        wizlab workflow ensure --name probe --definition <def.json> --dry-run   # exit 0 clean / 1 issues
    run_failure:
      cel_class: map key access            # {{trigger.riskIssue.resource.tags.<key>}} with the key absent
      error_type: EXECUTION_ERROR
      error_message: "program evaluation: no such key: <key>"
      null_chain_observed_failing: false   # 53 workflows with unguarded >=3-hop chains, 600 FAILED runs, none attributable
      error_edge_branch_name: error        # fixed string on every errorEdge; never author-named
      failed_step_outbound_edge: error     # read on EVERY failed step, edge defined or not
      error_path_followed: "run COMPLETED and a step at status FAILED"   # 0/400 without an edge, 358/400 with one
      throw_error: "run FAILED; step result status FAILED, error.message == throwError.message"
      verify: |
        automationWorkflowRuns(filterBy:{status:{equals:[FAILED]}}) { nodes { steps { status outboundEdge error { type message } step { type } } } }
    test_run:
      fire_to_completed_s: [0.046, 0.089] # runAutomationWorkflowTest EVENT -> status COMPLETED, n=6
      solver_budget_s: 60                 # `workflow-run ensure --timeout` default; ~700x the observed max
      # Wall clock on the grader for a check that fires one run then inspects, and for a solve that
      # converges a definition then fires one run. n=2 plays.
      check_fire_and_inspect_wall_s: [2, 6]
      solve_ensure_and_fire_wall_s: [7, 10]
      # Verb wall on the grader, each api() minting its own token: one round trip is ~1.5 s.
      workflow_run_ensure_wall_s: [3.35, 3.37]   # resolve + fire + one 2 s poll
      # Server-side startedAt->completedAt on a synthetic customData payload. Three orders of magnitude
      # under a cloud plane: there is no discovery latency here, only workflow execution. A task timeout
      # in minutes is measuring nothing.
    definition:
      create_s: 2.0   # createAutomationWorkflow, mutation only
      validate_s: 2.0 # validateAutomationWorkflow -- the CEL/edge pre-flight, no mutation
      # `workflow ensure` verb wall: validate + resolve + create or update, three round trips.
      ensure_wall_s: [3.55, 3.91]
      ensure_dry_run_wall_s: [1.48, 1.63]
      # publishAutomationWorkflowVersion is unimplemented ("Workflow versions are currently not
      # supported") and unnecessary: a create carrying enabled:true is already live.
    blue_agent:
      # Threat -> aiAnalysis. TBCMP has it enabled: every recent HIGH/CRITICAL THREAT_DETECTION issue reads
      # COMPLETED. Trigger-to-COMPLETED is not measurable from a grader: triggerThreatAIAnalysis refuses
      # a THIRD_PARTY service account regardless of scope (admin:all held), and the only INTEGRATION-type
      # account holding write:trigger_threat_ai_analysis is Wiz's own WIZ_SYSTEM one, which no operator
      # can mint or read a secret for. CORTEX_XSOAR_V2 and AXONIUS integration accounts carry threat
      # write scopes but not the trigger. Portal manual runs are capped at 5/day/tenant and are not
      # reachable from a workflow, so a lab grading a verdict picks a Threat already analyzed.
      manual_runs_per_day: 5
      trigger_scope_holders: [WIZ_SYSTEM]   # integration.type of every INTEGRATION SA with the scope
      verify_scope_holders: |
        serviceAccounts(first: 100) { nodes { type scopes integration { type } } }   # page on endCursor
      status_enum: [PENDING, IN_PROGRESS, COMPLETED, RATE_LIMITED]
      verdict_enum_observed: [MALICIOUS, NOT_MALICIOUS, SECURITY_TEST, PLANNED_ACTION]
      trigger_refusal: "this mutation is only available for users and integration service accounts"  # extensions.code INTERNAL, HTTP 200
      verify: |
        mutation($input: TriggerThreatAIAnalysisInput!) { triggerThreatAIAnalysis(input: $input) { systemActivityId } }
        issuesV2(filterBy:{type:[THREAT_DETECTION], severity:[HIGH,CRITICAL]}) { nodes { threatDetectionDetails { aiAnalysis { status verdict confidenceLevel analyzedAt } } } }
# ---------------------------------------------------------------------------------------------------
# Per entity kind. `external_id` is the column that decides whether an equality test can work at all:
# it is NOT uniform, and a check that assumes one shape misses silently rather than erroring.
#
#   aws_id     -- i-…, vol-…, vpc-…, sg-…, rtb-…, igw-…, nat-…
#   bare_name  -- the bucket name, the API id, the IP address itself
#   arn        -- the full ARN
#   composite  -- `##`-joined, e.g. <role-arn>##<policy-name>, <registry>##<repo>@sha256:…
#
# `instruqt_service` is what the dev track's `services:` list must contain for the resource to be creatable
# AT ALL, and it is the FIRST thing to check: a timing is worthless if the resource cannot exist. Instruqt
# implements that list as an org policy on the account, so an omission denies the API and the denial looks
# identical to a hard organizational one. Every service named below is present in tracks/aws-dev/config.yml
# today; `dev_lab_service_gaps` at the foot of this file records what is not, and which of the three kinds
# of gap it is. A resource needs its OWNING service too, not only the one that models it -- a bucket
# resource policy is an `iam` concept that cannot exist without `s3`.
# ---------------------------------------------------------------------------------------------------
entity_types:
  - cloud: aws
    wiz_type: VIRTUAL_MACHINE
    native_type: virtualMachine
    instruqt_service: [ec2]
    resource: aws_instance
    graph_min: 5.8
    crv2_min: 12.5
    first_seen: true
    created_at: true
    external_id: aws_id
  - cloud: aws
    wiz_type: VOLUME
    native_type: volume
    instruqt_service: [ec2, ebs]
    resource: aws_ebs_volume
    graph_min: 5.8
    crv2_min: 12.5
    first_seen: true
    created_at: true
    external_id: aws_id
  - cloud: aws
    wiz_type: SNAPSHOT
    native_type: ec2#encryptedsnapshot
    instruqt_service: [ec2, ebs]
    resource: aws_ebs_snapshot
    graph_min: 7.0
    crv2_min: 12.5
    first_seen: true
    created_at: true
    external_id: aws_id
  - cloud: aws
    wiz_type: VIRTUAL_NETWORK
    native_type: vpc
    instruqt_service: [ec2]
    resource: aws_vpc
    graph_min: 5.8
    crv2_min: 12.5
